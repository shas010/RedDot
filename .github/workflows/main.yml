name: Build Red Dot APK and Deploy Download Site

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Web Download Folder
        run: |
          mkdir -p web
          cp android/app/build/outputs/apk/debug/app-debug.apk web/RedDot.apk
          if [ -f web/download_page.html ]; then
            cp web/download_page.html web/index.html
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedDot-APK
          path: web/RedDot.apk

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
