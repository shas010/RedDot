name: Deploy Red Dot App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Web App
        run: |
          mkdir -p web

          # 1. Manifest
          cat << 'EOF' > web/manifest.json
          {
            "name": "Red Dot",
            "short_name": "Red Dot",
            "description": "One-tap status button to tell your circle when you're busy.",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#0F0F14",
            "theme_color": "#0F0F14",
            "icons": [
              {
                "src": "icon.svg",
                "sizes": "any",
                "type": "image/svg+xml",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

          # 2. Icon
          cat << 'EOF' > web/icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="128" fill="#0F0F14"/>
            <circle cx="256" cy="256" r="160" fill="#EF4444"/>
          </svg>
          EOF

          # 3. Service Worker
          cat << 'EOF' > web/sw.js
          const CACHE = 'reddot-v3';
          self.addEventListener('install', e => { self.skipWaiting(); });
          self.addEventListener('activate', e => { self.clients.claim(); });
          self.addEventListener('fetch', e => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
          EOF

          # 4. Interactive App HTML
          cat << 'EOF' > web/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8"/>
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
          <title>Red Dot</title>
          <link rel="manifest" href="./manifest.json"/>
          <link rel="icon" type="image/svg+xml" href="./icon.svg"/>
          <meta name="theme-color" content="#0F0F14"/>
          <meta name="mobile-web-app-capable" content="yes"/>
          <meta name="apple-mobile-web-app-capable" content="yes"/>
          <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
          <style>
          * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
          html, body { width:100%; height:100%; background:#0F0F14; color:#F1F1F5; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; }
          .app { width:100%; height:100%; max-width:440px; display:flex; flex-direction:column; background:#0F0F14; position:relative; overflow:hidden; }
          .banner { background:#6C63FF; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:700; color:#fff; flex-shrink:0; }
          .banner button { background:#fff; color:#4B44CC; border:none; border-radius:12px; padding:6px 14px; font-size:11px; font-weight:800; cursor:pointer; }
          .header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 8px; flex-shrink:0; border-bottom:1px solid #1C1C28; }
          .screen { display:none; flex-direction:column; flex:1; overflow-y:auto; padding:20px; }
          .screen.active { display:flex; }
          .btn-box { display:flex; flex-direction:column; align-items:center; justify-content:center; height:210px; position:relative; margin-bottom:20px; }
          .sbtn { width:176px; height:176px; border-radius:50%; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; z-index:2; transition:transform .15s; }
          .sbtn:active { transform:scale(.94); }
          .sbtn.avail { background:linear-gradient(145deg, #22C55E, #16A34A); box-shadow:0 8px 32px rgba(34,197,94,0.4); }
          .sbtn.busy { background:linear-gradient(145deg, #EF4444, #DC2626); box-shadow:0 8px 32px rgba(239,68,68,0.5); }
          .pulse { position:absolute; width:220px; height:220px; border-radius:50%; pointer-events:none; z-index:1; top:50%; left:50%; transform:translate(-50%,-50%); opacity:0; }
          .pulse.on { animation:pRing 1.8s ease-out infinite; background:rgba(239,68,68,0.18); }
          @keyframes pRing { 0%{transform:translate(-50%,-50%) scale(.9);opacity:.5} 70%{transform:translate(-50%,-50%) scale(1.2);opacity:0} 100%{transform:translate(-50%,-50%) scale(.9);opacity:0} }
          .card { background:#1C1C28; border:1px solid #2A2A3D; border-radius:18px; padding:16px; margin-bottom:12px; }
          .tabs { display:flex; background:#1C1C28; border-top:1px solid #2A2A3D; padding:10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); flex-shrink:0; }
          .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:2px 0; border:none; background:none; font-size:10px; font-weight:600; color:#5C5C78; }
          .tab.active { color:#6C63FF; }
          .modal { position:absolute; inset:0; background:rgba(0,0,0,.7); z-index:200; display:none; align-items:flex-end; }
          .modal.show { display:flex; }
          .sheet { background:#1C1C28; border-radius:26px 26px 0 0; padding:20px 20px 32px; width:100%; max-height:85%; overflow-y:auto; }
          .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:14px; }
          .pcard { background:#151520; border:1.5px solid #2A2A3D; border-radius:14px; padding:12px; cursor:pointer; text-align:left; color:#fff; }
          .pcard.sel { border-color:#6C63FF; background:rgba(108,99,255,0.15); }
          .tinput { background:#151520; border:1.5px solid #2A2A3D; border-radius:12px; padding:12px; font-size:14px; color:#fff; width:100%; outline:none; margin-bottom:12px; }
          .toast { position:absolute; bottom:80px; left:16px; right:16px; background:#1C1C28; border:1px solid #2A2A3D; border-radius:14px; padding:12px 16px; display:flex; align-items:center; gap:10px; transform:translateY(110px); opacity:0; transition:all .3s ease; z-index:300; pointer-events:none; }
          .toast.show { transform:translateY(0); opacity:1; }
          </style>
          </head>
          <body>
          <div class="app">
            <div class="banner" id="pwaBanner">
              <div style="display:flex;align-items:center;gap:6px;"><span>🔴</span><span>Install Red Dot on Phone</span></div>
              <button onclick="promptInstall()">Install</button>
            </div>
            <div class="header">
              <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">🔴</span><span style="font-size:16px;font-weight:800;">Red Dot</span></div>
              <span id="topBadge" style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(34,197,94,0.15);color:#22C55E;">● AVAILABLE</span>
            </div>
            <div class="toast" id="toast"><span id="tIcon" style="font-size:22px;"></span><div><div id="tTitle" style="font-size:13px;font-weight:700;"></div><div id="tSub" style="font-size:12px;color:#9393A8;"></div></div></div>

            <!-- HOME SCREEN -->
            <div class="screen active" id="sc-home">
              <div style="margin-bottom:16px;"><div style="font-size:24px;font-weight:800;">Hey, Aryan 👋</div><div id="hSub" style="font-size:14px;color:#9393A8;margin-top:2px;">You're available</div></div>
              <div class="btn-box">
                <div class="pulse" id="pRing"></div>
                <button class="sbtn avail" id="bigBtn" onclick="toggleStatus()">
                  <span id="bEmoji" style="font-size:42px;">✅</span>
                  <span id="bLabel" style="font-size:20px;font-weight:800;color:#fff;">Available</span>
                  <span id="bHint" style="font-size:11px;color:rgba(255,255,255,0.75);">Tap to go busy</span>
                </button>
              </div>
              <div id="sCard" style="display:none;" class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                  <div style="display:flex;align-items:center;gap:11px;"><span id="sEmoji" style="font-size:26px;">📚</span><div><div style="font-size:10px;text-transform:uppercase;color:#5C5C78;font-weight:700;">Currently</div><div id="sMsg" style="font-size:15px;font-weight:700;">In Class</div></div></div>
                  <button onclick="showModal('mPicker')" style="background:#2A2A3D;border:none;color:#9393A8;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;">Edit</button>
                </div>
              </div>
              <div id="nBtns" style="display:none;gap:10px;margin-bottom:20px;">
                <button onclick="showToast('🔔','Circle notified!','\"'+st.emoji+' '+st.msg+'\"')" style="flex:1;background:#EF4444;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;">🔔 Notify Circle</button>
                <button onclick="goTab('circle')" style="flex:1;background:#1C1C28;border:1px solid #2A2A3D;color:#fff;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;">👤 Individual</button>
              </div>
              <div style="font-size:16px;font-weight:700;margin-bottom:10px;">Your Circle (4 people)</div>
              <div id="homeFriends"></div>
            </div>

            <!-- CIRCLE SCREEN -->
            <div class="screen" id="sc-circle">
              <div style="font-size:24px;font-weight:800;margin-bottom:16px;">My Circle</div>
              <div id="circleFriends"></div>
            </div>

            <!-- HISTORY SCREEN -->
            <div class="screen" id="sc-history">
              <div style="font-size:24px;font-weight:800;margin-bottom:16px;">Status History</div>
              <div id="histList"></div>
            </div>

            <!-- TABS -->
            <div class="tabs">
              <button class="tab active" id="t-home" onclick="goTab('home')">🏠 Home</button>
              <button class="tab" id="t-circle" onclick="goTab('circle')">👥 Circle</button>
              <button class="tab" id="t-history" onclick="goTab('history')">📜 History</button>
            </div>

            <!-- PICKER MODAL -->
            <div class="modal" id="mPicker" onclick="if(event.target===this)closeModal('mPicker')">
              <div class="sheet">
                <div style="width:36px;height:4px;background:#3A3A50;border-radius:2px;margin:0 auto 15px;"></div>
                <div style="font-size:18px;font-weight:800;margin-bottom:14px;">What are you busy with?</div>
                <div class="pgrid" id="pgrid"></div>
                <input class="tinput" id="custIn" placeholder="Custom message..." style="display:none;" />
                <button id="setBtn" onclick="confirmStatus()" style="display:none;width:100%;background:#EF4444;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;cursor:pointer;">Set Status 🔴</button>
              </div>
            </div>
          </div>

          <script>
          if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
          let defPrompt;
          window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); defPrompt = e; });
          function promptInstall() {
            if (defPrompt) defPrompt.prompt();
            else alert("Tap the 3 dots in Chrome → tap 'Install app' or 'Add to Home screen'!");
          }

          const st = {
            busy:false, emoji:'✅', msg:'Available', selPreset:null,
            friends:[{n:'Ayesha',b:true,e:'📚',m:'In Class'},{n:'Ravi',b:true,e:'💼',m:'At Work'},{n:'Priya',b:false,e:'',m:''},{n:'Sam',b:true,e:'😴',m:'Sleeping'}],
            hist:[{e:'📚',m:'In Class',b:true,t:'Today, 10:15 AM'},{e:'✅',m:'Available',b:false,t:'Today, 11:45 AM'},{e:'💼',m:'At Work',b:true,t:'Yesterday, 2:00 PM'}]
          };
          const PRESETS = [{e:'📚',l:'In Class'},{e:'💼',l:'At Work'},{e:'😴',l:'Sleeping'},{e:'🚗',l:'Driving'},{e:'🎧',l:'Do Not Disturb'},{e:'🏋️',l:'At the Gym'},{e:'✏️',l:'Custom...'}];

          function toggleStatus() {
            if (!st.busy) showModal('mPicker');
            else { st.busy=false; st.emoji='✅'; st.msg='Available'; logStatus(false,'✅','Available'); updUI(); showToast('✅','Status cleared','You are available'); }
          }
          function logStatus(b,e,m) {
            const now = new Date();
            st.hist.unshift({e,m,b,t:'Today, '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
            renderHist();
          }
          function updUI() {
            const btn = document.getElementById('bigBtn');
            const badge = document.getElementById('topBadge');
            if (st.busy) {
              btn.className = 'sbtn busy';
              document.getElementById('bEmoji').textContent = st.emoji;
              document.getElementById('bLabel').textContent = 'Busy';
              document.getElementById('bHint').textContent = 'Tap to clear';
              document.getElementById('hSub').textContent = "You're marked busy";
              document.getElementById('sCard').style.display = 'block';
              document.getElementById('nBtns').style.display = 'flex';
              document.getElementById('pRing').className = 'pulse on';
              document.getElementById('sEmoji').textContent = st.emoji;
              document.getElementById('sMsg').textContent = st.msg;
              badge.textContent = '● BUSY'; badge.style.color = '#EF4444';
            } else {
              btn.className = 'sbtn avail';
              document.getElementById('bEmoji').textContent = '✅';
              document.getElementById('bLabel').textContent = 'Available';
              document.getElementById('bHint').textContent = 'Tap to go busy';
              document.getElementById('hSub').textContent = "You're available";
              document.getElementById('sCard').style.display = 'none';
              document.getElementById('nBtns').style.display = 'none';
              document.getElementById('pRing').className = 'pulse';
              badge.textContent = '● AVAILABLE'; badge.style.color = '#22C55E';
            }
          }
          function confirmStatus() {
            const msg = st.selPreset.l || document.getElementById('custIn').value.trim();
            if (!msg) return;
            st.busy = true; st.emoji = st.selPreset.e; st.msg = msg;
            logStatus(true, st.selPreset.e, msg);
            closeModal('mPicker'); updUI(); showToast('🔴','Status set!', msg);
          }
          function renderPresets() {
            document.getElementById('pgrid').innerHTML = PRESETS.map(p => `
              <div class="pcard" onclick="selP('${p.e}','${p.l}')">
                <span style="font-size:22px;">${p.e}</span>
                <div style="font-size:13px;margin-top:4px;">${p.l}</div>
              </div>`).join('');
          }
          function selP(e,l) {
            document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('sel'));
            event.currentTarget.classList.add('sel');
            if (l === 'Custom...') { document.getElementById('custIn').style.display = 'block'; st.selPreset={e:'✏️',l:''}; document.getElementById('custIn').focus(); document.getElementById('custIn').oninput = ev => st.selPreset.l=ev.target.value; }
            else { document.getElementById('custIn').style.display = 'none'; st.selPreset={e,l}; }
            document.getElementById('setBtn').style.display = 'block';
            document.getElementById('setBtn').textContent = 'Set Status ' + e;
          }
          function renderFriends() {
            const h = st.friends.map(f => `
              <div style="display:flex;align-items:center;gap:12px;background:#1C1C28;padding:12px;border-radius:14px;margin-bottom:8px;">
                <div style="width:38px;height:38px;border-radius:19px;background:${f.b?'rgba(239,68,68,0.2)':'rgba(34,197,94,0.2)'};color:${f.b?'#EF4444':'#22C55E'};display:flex;align-items:center;justify-content:center;font-weight:700;">${f.n[0]}</div>
                <div style="flex:1;"><div style="font-size:14px;font-weight:700;">${f.n}</div><div style="font-size:12px;color:#9393A8;">${f.b?f.e+' '+f.m:'Available'}</div></div>
                <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${f.b?'rgba(239,68,68,0.2)':'rgba(34,197,94,0.2)'};color:${f.b?'#EF4444':'#22C55E'};">${f.b?'Busy':'Free'}</span>
              </div>`).join('');
            document.getElementById('homeFriends').innerHTML = h;
            document.getElementById('circleFriends').innerHTML = h;
          }
          function renderHist() {
            document.getElementById('histList').innerHTML = st.hist.map(h => `
              <div style="display:flex;align-items:center;gap:12px;background:#1C1C28;padding:12px;border-radius:14px;margin-bottom:8px;">
                <span style="font-size:24px;">${h.e}</span>
                <div style="flex:1;"><div style="font-size:14px;font-weight:700;">${h.m}</div><div style="font-size:11px;color:#9393A8;">${h.t}</div></div>
                <span style="font-size:10px;font-weight:700;color:${h.b?'#EF4444':'#22C55E'};">${h.b?'BUSY':'FREE'}</span>
              </div>`).join('');
          }
          function goTab(t) {
            ['home','circle','history'].forEach(id => {
              document.getElementById('sc-'+id).classList.remove('active');
              document.getElementById('t-'+id).classList.remove('active');
            });
            document.getElementById('sc-'+t).classList.add('active');
            document.getElementById('t-'+t).classList.add('active');
          }
          function showModal(id) { document.getElementById(id).classList.add('show'); }
          function closeModal(id) { document.getElementById(id).classList.remove('show'); }
          let tT;
          function showToast(icon,title,sub) {
            clearTimeout(tT);
            document.getElementById('tIcon').textContent = icon;
            document.getElementById('tTitle').textContent = title;
            document.getElementById('tSub').textContent = sub;
            const el = document.getElementById('toast');
            el.classList.add('show');
            tT = setTimeout(() => el.classList.remove('show'), 3000);
          }
          renderPresets(); renderFriends(); renderHist();
          </script>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
